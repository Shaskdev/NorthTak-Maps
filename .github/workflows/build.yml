name: Build layers

# Builds the KMZ layers and publishes them as a single commit on the `data`
# branch (force-pushed, no history), which is what the NorthTak plugin reads.
# Runs hourly; a run with no data changes pushes nothing.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "docs/**", "ATTRIBUTION.md", ".github/workflows/build.yml"]

permissions:
  contents: write

concurrency:
  group: build-layers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: python3 -I -m unittest discover -s tests

      - name: Get last published data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git worktree add --detach prev FETCH_HEAD
          else
            mkdir prev
          fi

      - name: Build layers
        run: |
          python3 -I pipeline/build.py --out dist --previous prev
          cp docs/DATA_README.md dist/README.md
          cp ATTRIBUTION.md dist/ATTRIBUTION.md

      - name: Publish to data branch if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          old_tree=$(git -C prev rev-parse -q --verify 'HEAD^{tree}' 2>/dev/null || true)
          cd dist
          git init -q -b data
          git add -A
          new_tree=$(git write-tree)
          if [ "$new_tree" = "$old_tree" ]; then
            echo "No changes; nothing to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Layers $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
